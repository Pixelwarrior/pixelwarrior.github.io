name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned deliberately. `latest` means an upstream release can break a deploy
  # with no change on our side — bump this on purpose, after testing locally.
  HUGO_VERSION: '0.164.0'
  TZ: America/Chicago

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # Generated social cards are expensive to rebuild every run.
      - name: Restore Hugo cache
        uses: actions/cache@v4
        with:
          path: |
            resources/_gen
            /tmp/hugo_cache
          key: hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('assets/**', 'themes/**', 'content/**', 'hugo.toml') }}
          restore-keys: |
            hugo-${{ env.HUGO_VERSION }}-

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --minify --gc --cleanDestinationDir --printPathWarnings

      - name: Verify build output
        run: |
          set -euo pipefail
          test -s public/index.html            || { echo "::error::index.html missing or empty"; exit 1; }
          test -s public/sitemap.xml           || { echo "::error::sitemap.xml missing"; exit 1; }
          test -s public/index.xml             || { echo "::error::RSS feed missing"; exit 1; }
          test -s public/index.json            || { echo "::error::search index missing"; exit 1; }
          test -s public/404.html              || { echo "::error::404 page missing"; exit 1; }
          test -s public/robots.txt            || { echo "::error::robots.txt missing"; exit 1; }
          test -f public/CNAME                 || { echo "::error::CNAME missing — custom domain would break"; exit 1; }
          grep -q 'og:image' public/index.html || { echo "::error::Open Graph tags missing"; exit 1; }
          echo "Build verified: $(find public -name '*.html' | wc -l) HTML pages."

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
