<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-{{ .Kind }}{{ end }}">
  {{ partial "header.html" . }}

  <main id="main" class="site-main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
  {{ partial "search-modal.html" . }}

  {{- $js := resources.Get "js/main.js" -}}
  {{- if hugo.IsProduction -}}{{- $js = $js | minify | fingerprint "sha256" -}}{{- end }}
  <script src="{{ $js.RelPermalink }}"{{ with $js.Data.Integrity }} integrity="{{ . }}"{{ end }} defer></script>
</body>
</html>
