<dialog class="search-dialog" id="search-dialog" aria-label="Search the site">
  <div class="search-box">
    <div class="search-field">
      <span class="search-prompt" aria-hidden="true">&gt;</span>
      <input type="search" id="search-input" class="search-input" placeholder="Search posts, writeups, tags…"
             autocomplete="off" spellcheck="false" aria-controls="search-results" aria-describedby="search-hint">
      <button class="search-close" data-search-close aria-label="Close search">esc</button>
    </div>
    <p class="search-hint" id="search-hint">Type to search. <kbd>↑</kbd><kbd>↓</kbd> to navigate, <kbd>enter</kbd> to open.</p>
    <ul class="search-results" id="search-results" role="listbox" aria-label="Search results"></ul>
    <p class="search-status" role="status" aria-live="polite"></p>
  </div>
</dialog>
